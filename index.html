<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#797b7e"><title>S13 Wheel Studio</title><link rel="stylesheet" href="./styles.css"></head><body><main id="viewer" aria-label="3D Silvia viewer"></main><div id="loading">Loading models…</div><button id="toggle" aria-label="Show or hide wheel settings" aria-expanded="true">⚙</button><aside id="panel"><div class="top"><span>GARAGE / S13</span><button id="close" aria-label="Close">×</button></div><h1>Wheel setup</h1><div class="field"><label for="wheel">SSR model</label><select id="wheel"><option value="stock">Factory wheels</option><option value="mk1">SSR MK1</option><option value="mk2">SSR MK2</option><option value="mk3">SSR MK3</option></select></div><div class="field"><label for="face">Wheel face colour</label><div class="paint"><input type="color" id="face" value="#c0c4c8"><span>Polished lips stay silver</span></div></div><div class="field"><label for="lip">180SX front lip</label><select id="lip"><option value="off">Removed</option><option value="on">Installed</option></select></div><div class="field"><div class="pair"><label for="ride">Ride height</label><output id="rideOut">0 mm</output></div><input id="ride" type="range" min="0" max="90" step="5" value="0"><div class="range"><span>Stock</span><span>Lower</span></div></div><div class="field"><div class="pair"><label for="front">Front camber</label><output id="frontOut">0.0°</output></div><input id="front" type="range" min="-12" max="4" step=".5" value="0"></div><div class="field"><div class="pair"><label for="rear">Rear camber</label><output id="rearOut">0.0°</output></div><input id="rear" type="range" min="-12" max="4" step=".5" value="0"></div><button id="reset">Reset setup</button><p class="note">Visual preview only. Ride height, camber and wheel fitment are illustrative, not measured alignment or clearance.</p></aside><script type="module" src="./app.js"></script></body></html>
